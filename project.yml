name: AppSwipe
options:
  bundleIdPrefix: io.github.lebedev-nikita
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SwitchCore:
    path: SwitchCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 13
    # Builds are signed by `just build` with the local "AppSwipe Development" certificate,
    # which Xcode does not list because it is self-signed.
    CODE_SIGNING_ALLOWED: NO
    ENABLE_DEBUG_DYLIB: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  AppSwipe:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: SwitchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lebedev-nikita.AppSwipe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AppSwipe
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Lebedev Nikita. MIT License."
